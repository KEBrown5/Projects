<!DOCTYPE html>
<html lang="en">
    <head>
        <title>EverGlow Candles</title>
        <meta charset = "utf-8">
        <meta name= "viewport" content="width=device-width, initial-scale=1">
        <meta name = "description" content = "E-commerce candle shop">
        <meta name = "author" content = "Kyle Brown">
        <meta name = "keywords" content = "Candle, buy, shop, scent, fragrence">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!--Bootstrap-->
        <link rel = "stylesheet" href = "styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Google Fonts-->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class = "container">
            <!-- Top Header -->
            <header class="py-3">
                <div class = "header-image"></div>
            </header>

            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
                <div class="container justify-content-center">
                    <div class="navbar">
                        <ul class="navbar-nav">
                            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                            <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                            <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            
            <main>
                <!-- Content Section -->
                <div class="container my-5">
                    <div class="row text-center pb-3">
                        <h1 class = "pb-3">Contact Us</h1>
                        <a class = "h2" href = "EverglowCandles@gmail.com">EverglowCandles@gmail.com</a>
                        <h2>223 Richwine Road, Carlisle PA</h2>
                        <h2>(717) 547-1092</h2>
                    </div>
                    <h1 class = "text-center">Leave a Message</h1>
                    <form id = "contact-form" class = "container my-5" style="max-width: 900px;">
                        <div class = "row g-4">
                            <!-- Name -->
                            <div class="col-md-6">
                                <label for="name" class="form-label">
                                    Name <span class="text-danger">*</span>
                                </label>
                                <input type = "text" class = "form-control" id = "name" placeholder = "Name" required>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label">
                                    Email <span class="text-danger">*</span>
                                </label>
                                <input type = "email" class = "form-control" id = "email" placeholder = "Email" required>
                            </div>

                            <!-- Radio Buttons -->
                            <fieldset>
                                <legend class="form-label mb-2">
                                    Reason for Contact <span class="text-danger">*</span>
                                </legend>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="reason" id="general" required>
                                    <label class="form-check-label" for="general">
                                    General Question
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="reason" id="order">
                                    <label class="form-check-label" for="order">
                                    Order Issue
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="reason" id="product">
                                    <label class="form-check-label" for="product">
                                    Product Question
                                    </label>
                                </div>
                            </fieldset>

                            <!-- Message -->
                            <div class="col-12">
                                <label for = "message" class="form-label">
                                    Message <span class="text-danger">*</span>
                                </label>
                                <textarea class = "form-control" id = "message" rows = "6" placeholder = "Message" required></textarea>
                            </div>

                            <!-- Submit Button -->
                            <div class = "col-md-6">
                                <button type = "submit" class = "btn btn-send px-4 py-2">
                                    SEND
                                </button>
                            </div>

                            <!-- Reset Button -->
                            <div class = "d-flex col-md-6 justify-content-end">
                                <button type = "reset" class = "btn btn-send px-4 py-2">
                                    CANCEL
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </main>

            <!-- Footer -->
            <footer>
                <p>EverGlow Candles</p>
                <p>223 Richwine Road, Carlisle PA</p>
            </footer>
        </div>
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            const contactForm = document.getElementById("contact-form");
            contactForm.addEventListener("submit", handleSubmit);

            function handleSubmit(e) {
                e.preventDefault();

                alert("Message Sent!");
                console.log("Submitted");
            }
        </script>
    </body>
</html>
